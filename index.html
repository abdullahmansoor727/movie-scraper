<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stream</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.8.3/plyr.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script src="https://cdn.plyr.io/3.8.3/plyr.polyfilled.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: system-ui, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    html[data-player-rendering],
    html[data-player-rendering] body {
      width: 100% !important;
      min-width: 0 !important;
      height: 100% !important;
      min-height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      overscroll-behavior: none !important;
      background: #000 !important;
    }

    html[data-player-rendering] body {
      font-family: system-ui, sans-serif !important;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #000;
    }

    #loader-bg {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      opacity: 0;
      transition: opacity .6s ease;
    }

    .spinner {
      position: relative;
      z-index: 1;
      width: 72px;
      height: 72px;
      border: 5px solid rgba(255, 255, 255, .15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loader-text {
      position: relative;
      z-index: 1;
      font-size: .95rem;
      color: rgba(255, 255, 255, .6);
      letter-spacing: .04em;
      text-shadow: 0 1px 4px #000;
    }

    #player {
      position: fixed;
      inset: 0;
      display: none;
      background: #000;
    }

    html[data-player-rendering] #player,
    html[data-player-rendering] #player * {
      letter-spacing: 0 !important;
      text-shadow: none !important;
      text-transform: none !important;
    }

    #player .plyr {
      width: 100%;
      height: 100%;
      color: #fff;
      --plyr-color-main: #00b3ff;
      --plyr-video-background: #000;
      --plyr-video-control-color: #fff;
      --plyr-video-control-color-hover: #fff;
      --plyr-video-control-background-hover: rgba(0, 179, 255, .9);
      --plyr-menu-background: rgba(17, 24, 39, .98);
      --plyr-menu-color: #f8fafc;
      --plyr-menu-border-color: rgba(255, 255, 255, .12);
      --plyr-menu-shadow: 0 18px 45px rgba(0, 0, 0, .45);
      --plyr-tooltip-background: rgba(17, 24, 39, .96);
      --plyr-tooltip-color: #fff;
      --plyr-control-radius: 6px;
    }

    #player .plyr button,
    #player .plyr [role="button"] {
      border: 0 !important;
      box-shadow: none;
      color: inherit !important;
      font: inherit !important;
    }

    #player .plyr__control {
      background-color: transparent !important;
    }

    #player .plyr__control--overlaid {
      color: #fff !important;
      background: rgba(0, 179, 255, .95) !important;
    }

    #player .plyr__control--overlaid:hover,
    #player .plyr__control--overlaid:focus-visible {
      color: #fff !important;
      background: #38bdf8 !important;
    }

    #player .plyr__controls .plyr__control {
      color: #fff;
    }

    #player .plyr__controls .plyr__control:hover,
    #player .plyr__controls .plyr__control:focus-visible,
    #player .plyr__controls .plyr__control[aria-expanded="true"] {
      color: #fff !important;
      background: rgba(0, 179, 255, .9) !important;
    }

    #player .plyr__menu__container {
      color: #f8fafc !important;
      background: rgba(17, 24, 39, .98) !important;
      border: 1px solid rgba(255, 255, 255, .12);
    }

    #player .plyr__menu__container>div,
    #player .plyr__menu__container [role="menu"] {
      color: #f8fafc !important;
      background: rgba(17, 24, 39, .98) !important;
    }

    #player .plyr__menu__container::after {
      border-top-color: rgba(17, 24, 39, .98) !important;
    }

    #player .plyr__menu__container .plyr__control {
      color: #f8fafc !important;
    }

    #player .plyr__menu__container .plyr__control:hover,
    #player .plyr__menu__container .plyr__control:focus-visible,
    #player .plyr__menu__container .plyr__control[role="menuitemradio"][aria-checked="true"] {
      color: #fff !important;
      background: rgba(0, 179, 255, .9) !important;
    }

    #player .plyr__video-wrapper {
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .plyr__menu__container div[role="menu"] {
      max-height: 240px;
      overflow-y: auto;
    }

    #stream-actions {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 5;
      display: none;
      gap: 8px;
    }

    .stream-btn {
      min-width: 88px;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 6px;
      background: rgba(0, 0, 0, .68);
      color: #fff;
      font: inherit;
      font-size: .82rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .stream-btn:hover {
      background: rgba(255, 255, 255, .14);
    }

    .stream-btn:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }

    #copy-status {
      position: fixed;
      top: 56px;
      right: 12px;
      z-index: 6;
      max-width: min(360px, calc(100vw - 24px));
      padding: 9px 11px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 6px;
      background: rgba(0, 0, 0, .78);
      color: rgba(255, 255, 255, .9);
      font-size: .8rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #copy-status.visible {
      opacity: 1;
    }

    @media (max-width: 600px) {
      #stream-actions {
        left: 12px;
        right: 12px;
      }

      .stream-btn {
        flex: 1;
      }

      #copy-status {
        left: 12px;
        right: 12px;
      }
    }

    #usage {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #000;
      gap: 10px;
    }

    #usage p {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, .65);
      line-height: 2;
    }

    #err {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #000;
    }

    #err-title {
      font-size: 2.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 18px;
    }

    #err-link {
      font-size: 1.1rem;
      color: #60a5fa;
      text-decoration: underline;
      cursor: pointer;
    }

    #err-link:hover {
      color: #93c5fd;
    }

    #err-detail {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .78rem;
      color: rgba(255, 255, 255, .35);
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>

  <div id="loader">
    <div id="loader-bg"></div>
    <div class="spinner"></div>
    <div id="loader-text">Loading stream...</div>
  </div>

  <div id="usage">
    <p>
      <span style="color:#fff;font-size:1.2rem">Stream</span><br><br>
      <code style="color:rgba(255,255,255,.8)">?id=550</code> &nbsp;— movie<br>
      <code style="color:rgba(255,255,255,.8)">?id=456&amp;s=1&amp;e=1</code> &nbsp;— TV episode
    </p>
  </div>

  <div id="err">
    <div id="err-title">Error Occurred</div>
    <a id="err-link" href="#">Try vidsrc.xyz instead?</a>
    <div id="err-detail"></div>
  </div>

  <div id="player">
    <video id="v" controls playsinline preload="auto"></video>
  </div>

  <div id="stream-actions" aria-label="Stream actions">
    <button id="copy-hls" class="stream-btn" type="button" title="Copy proxied HLS playlist URL">HLS URL</button>
  </div>
  <div id="copy-status" role="status" aria-live="polite"></div>

  <script>
    var TMDB_KEY = '3a73619bbb8fc6d47742d1b5b2b707b5';

    var MESSAGES = [
      'Loading stream...', 'Contacting the mothership...', 'Bribing the servers...',
      'Untangling the cables...', 'Asking nicely...', 'Decoding the matrix...',
      'Warming up the hamsters...', 'Negotiating with the cloud...', 'Almost there...',
      'Convincing pixels to move...', 'Poking the API...', 'Summoning bandwidth...',
      'Greasing the pipes...', 'Waking up the interns...', 'Stealing the stream (legally)...'
    ];
    var msgEl = document.getElementById('loader-text');
    var msgIdx = 0;
    var msgTimer = setInterval(function () {
      msgIdx = (msgIdx + 1) % MESSAGES.length;
      msgEl.textContent = MESSAGES[msgIdx];
    }, 2200);

    var p = new URLSearchParams(location.search);
    var id = p.get('id'), s = p.get('s'), e = p.get('e');
    var currentHlsUrl = '';
    var copyStatusTimer = null;
    var hls = null;
    var plyr = null;
    var videoEl = document.getElementById('v');
    var hlsQualityByHeight = {};
    var subtitleSyncTimers = [];
    var previewThumbnails = [];

    function setPlayerRendering(active) {
      document.documentElement.toggleAttribute('data-player-rendering', !!active);
      document.body.toggleAttribute('data-player-rendering', !!active);
    }

    function setQuality(value) {
      var height = Number(value);
      if (!hls) return;
      if (height === 0) {
        hls.currentLevel = -1;
        return;
      }
      if (typeof hlsQualityByHeight[height] === 'number') {
        hls.currentLevel = hlsQualityByHeight[height];
      }
    }

    function getQualityOptions() {
      if (!hls || !hls.levels || !hls.levels.length) return [];
      hlsQualityByHeight = {};
      hls.levels.forEach(function (level, index) {
        var height = Number(level.height);
        if (!height) return;
        if (
          typeof hlsQualityByHeight[height] !== 'number' ||
          (level.bitrate || 0) > (hls.levels[hlsQualityByHeight[height]].bitrate || 0)
        ) {
          hlsQualityByHeight[height] = index;
        }
      });
      return Object.keys(hlsQualityByHeight).map(Number).sort(function (a, b) {
        return b - a;
      });
    }

    function textTracksArray() {
      return videoEl && videoEl.textTracks ? Array.prototype.slice.call(videoEl.textTracks) : [];
    }

    function findHlsSubtitleTrack(textTrack) {
      if (!hls || !hls.subtitleTracks || !textTrack) return -1;
      var label = (textTrack.label || '').toLowerCase();
      var language = (textTrack.language || '').toLowerCase();
      var subtitleTracks = hls.subtitleTracks || [];
      var byLanguageAndLabel = subtitleTracks.findIndex(function (track) {
        return (track.lang || '').toLowerCase() === language && (track.name || '').toLowerCase() === label;
      });
      if (byLanguageAndLabel >= 0) return byLanguageAndLabel;

      var byLanguage = subtitleTracks.findIndex(function (track) {
        return language && (track.lang || '').toLowerCase() === language;
      });
      if (byLanguage >= 0) return byLanguage;

      return subtitleTracks.findIndex(function (track) {
        return label && (track.name || '').toLowerCase() === label;
      });
    }

    function syncActiveSubtitleTrack() {
      var activeTrack = null;
      var tracks = textTracksArray();

      // 1. Identify which track the user selected via Plyr
      tracks.forEach(function (track) {
        if (track.mode === 'showing' && !activeTrack) {
          activeTrack = track;
        }
      });

      if (!hls || !hls.subtitleTracks || !hls.subtitleTracks.length) return;

      // 2. If no track is showing, tell HLS to mute text streams
      if (!activeTrack) {
        if (hls.subtitleTrack !== -1) {
          hls.subtitleTrack = -1;
        }
        return;
      }

      // 3. Match the track label/language up with HLS's manifest tracks
      var hlsSubtitleTrack = findHlsSubtitleTrack(activeTrack);
      if (hlsSubtitleTrack >= 0 && hls.subtitleTrack !== hlsSubtitleTrack) {
        hls.subtitleTrack = hlsSubtitleTrack;
      } else if (hlsSubtitleTrack < 0 && hls.subtitleTrack !== -1) {
        hls.subtitleTrack = -1;
      }
    }

    function clearSubtitleSyncTimers() {
      subtitleSyncTimers.forEach(function (timer) {
        clearTimeout(timer);
      });
      subtitleSyncTimers = [];
    }

    function scheduleSubtitleSync() {
      debugger;
      console.log('Scheduling subtitle sync');
      clearSubtitleSyncTimers();
      [0, 80, 250].forEach(function (delay) {
        subtitleSyncTimers.push(setTimeout(syncActiveSubtitleTrack, delay));
      });
    }

    function disableSubtitles() {
      clearSubtitleSyncTimers();
      textTracksArray().forEach(function (track) {
        // Changed from 'disabled' to 'hidden' so Plyr's menu can still read them
        track.mode = 'hidden';
      });
      if (hls && hls.subtitleTracks && hls.subtitleTracks.length) {
        hls.subtitleTrack = -1;
      }
    }


    function wireSubtitleControls() {
      if (!videoEl || videoEl.dataset.subtitleControlsWired) return;
      videoEl.dataset.subtitleControlsWired = 'true';
      if (videoEl.textTracks) {
        if (videoEl.textTracks.addEventListener) {
          videoEl.textTracks.addEventListener('change', scheduleSubtitleSync);
        }
        videoEl.textTracks.onchange = scheduleSubtitleSync;
      }
    }

    function initPlayer(qualityOptions) {
      if (plyr || !videoEl || !window.Plyr) return;
      qualityOptions = qualityOptions || [];
      plyr = new Plyr(videoEl, {
        controls: [
          'play-large',
          'rewind',
          'play',
          'fast-forward',
          'progress',
          'current-time',
          'duration',
          'mute',
          'volume',
          'captions',
          'settings',
          'pip',
          'airplay',
          'fullscreen'
        ],
        settings: qualityOptions.length ? ['captions', 'quality', 'speed'] : ['captions', 'speed'],
        quality: qualityOptions.length ? {
          default: 0,
          options: [0].concat(qualityOptions), // Fixed syntax notation array definition
          forced: true,
          onChange: setQuality
        } : undefined,
        i18n: {
          qualityLabel: { 0: 'Auto' }
        },
        seekTime: 10,
        captions: { active: false, language: 'auto', update: true },
        keyboard: { focused: true, global: true },
        tooltips: { controls: true, seek: true },
        previewThumbnails: previewThumbnails.length ? {
          enabled: true,
          src: previewThumbnails
        } : undefined
      });

      wireSubtitleControls();
      disableSubtitles();

      plyr.on('captionsenabled', scheduleSubtitleSync);
      plyr.on('captionsdisabled', scheduleSubtitleSync);

      plyr.on('languagechange', function () {
        var tracks = textTracksArray();
        var plyrLang = (plyr.language || '').toLowerCase();

        if (plyrLang && plyrLang !== 'auto') {
          tracks.forEach(function (track) {
            var trackLang = (track.language || '').toLowerCase();
            if (trackLang === plyrLang) {
              track.mode = 'showing';
            } else {
              track.mode = 'hidden';
            }
          });
        }
        scheduleSubtitleSync();
      });
    }

    function setCaptionTracks(tracks) {
      if (!videoEl) return;
      Array.prototype.slice.call(videoEl.querySelectorAll('track[data-stream-track]')).forEach(function (track) {
        track.remove();
      });
      (tracks || []).forEach(function (track, index) {
        if (!track || !track.src) return;
        var el = document.createElement('track');
        el.setAttribute('data-stream-track', '');
        el.kind = track.kind || 'subtitles';
        el.label = track.label || 'Subtitle ' + (index + 1);
        el.srclang = track.srclang || 'und';
        el.src = track.src;
        el.default = false;
        videoEl.appendChild(el);
      });
      disableSubtitles();
    }

    function setPreviewThumbnails(tracks) {
      previewThumbnails = (tracks || []).filter(Boolean);
    }

    function playVideo() {
      if (videoEl) {
        var playPromise = plyr ? plyr.play() : videoEl.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function () { });
        }
      }
    }

    function attachHlsSource(src) {
      if (!videoEl) return;
      if (hls) {
        hls.destroy();
        hls = null;
      }
      videoEl.removeAttribute('src');
      videoEl.load();
      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.attachMedia(videoEl);
        hls.on(Hls.Events.MEDIA_ATTACHED, function () {
          hls.loadSource(src);
        });
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          hls.subtitleTrack = -1;
          initPlayer(getQualityOptions());
          disableSubtitles();
          playVideo();
        });
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            showErr('HLS playback error: ' + (data.details || data.type));
            hls.destroy();
            hls = null;
          }
        });
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        initPlayer();
        videoEl.src = src;
        videoEl.load();
        playVideo();
      } else {
        showErr('HLS playback is not supported in this browser.');
      }
    }

    function showPlayer() {
      setPlayerRendering(true);
      clearInterval(msgTimer);
      document.getElementById('loader').style.display = 'none';
      document.getElementById('player').style.display = 'block';
      if (currentHlsUrl) document.getElementById('stream-actions').style.display = 'flex';
    }

    function showErr(msg) {
      setPlayerRendering(false);
      clearInterval(msgTimer);
      document.getElementById('loader').style.display = 'none';
      document.getElementById('stream-actions').style.display = 'none';
      document.getElementById('err').style.display = 'flex';
      document.getElementById('err-detail').textContent = msg || '';
      var vidsrcUrl = s
        ? 'https://vidsrc.xyz/embed/tv?tmdb=' + id + '&season=' + s + '&episode=' + (e || '1')
        : 'https://vidsrc.xyz/embed/movie?tmdb=' + id;
      document.getElementById('err-link').href = vidsrcUrl;
    }

    function loadBackdrop(id, isTv) {
      var type = isTv ? 'tv' : 'movie';
      fetch('https://api.themoviedb.org/3/' + type + '/' + id + '?api_key=' + TMDB_KEY)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var img = d.backdrop_path || d.poster_path;
          if (!img) return;
          var imageUrl = 'https://image.tmdb.org/t/p/w1280' + img;
          var url = 'https://wsrv.nl/?url=' + encodeURIComponent(imageUrl) + '&bg=black&blur=3';
          var bg = document.getElementById('loader-bg');
          if (videoEl) {
            videoEl.poster = imageUrl;
            if (plyr) {
              plyr.poster = imageUrl;
            }
          }
          var preload = new Image();
          preload.onload = function () { bg.style.backgroundImage = 'url(' + url + ')'; bg.style.opacity = '1'; };
          preload.src = url;
          if (isTv && s && e) {
            fetch('https://api.themoviedb.org/3/tv/' + id + '/season/' + s + '/episode/' + (e || '1') + '?api_key=' + TMDB_KEY)
              .then(function (resp) { return resp.ok ? resp.json() : null; })
              .then(function (ep) {
                if (ep && mediaMeta) mediaMeta.episodeTitle = ep.name || '';
              })
              .catch(function () { });
          }
        })
        .catch(function () { });
    }

    function setHlsHelper(rawUrl) {
      var proxiedPath = '/api/playlist.m3u8?url=' + encodeURIComponent(rawUrl);
      currentHlsUrl = new URL(proxiedPath, location.href).href;
    }

    function showCopyStatus(message) {
      var el = document.getElementById('copy-status');
      el.textContent = message;
      el.classList.add('visible');
      clearTimeout(copyStatusTimer);
      copyStatusTimer = setTimeout(function () {
        el.classList.remove('visible');
      }, 2200);
    }

    function fallbackCopy(text, onDone, onFail) {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy') ? onDone() : onFail();
      } catch (err) {
        onFail();
      }
      document.body.removeChild(textarea);
    }

    function copyText(text, message) {
      if (!text) return showCopyStatus('Stream is not ready');
      var done = function () { showCopyStatus(message); };
      var fail = function () { showCopyStatus('Copy failed'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {
          fallbackCopy(text, done, fail);
        });
      } else {
        fallbackCopy(text, done, fail);
      }
    }

    document.getElementById('copy-hls').addEventListener('click', function () {
      copyText(currentHlsUrl, 'HLS URL copied');
    });

    if (!id) {
      setPlayerRendering(false);
      clearInterval(msgTimer);
      document.getElementById('loader').style.display = 'none';
      document.getElementById('usage').style.display = 'flex';
    } else {
      loadBackdrop(id, !!s);
      var api = '/api?' + (s ? 'id=' + id + '&s=' + s + '&e=' + (e || '1') : 'id=' + id);
      fetch(api)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.error) return showErr(d.error);
          if (!d.url) return showErr('No playlist in response');
          setHlsHelper(d.url);
          setCaptionTracks(d.tracks);
          setPreviewThumbnails(d.previewThumbnails);
          play(d.url);
        })
        .catch(function (err) { showErr(err.message); });
    }

    if (videoEl) {
      videoEl.addEventListener('loadedmetadata', showPlayer);
      videoEl.addEventListener('error', function () {
        showErr('Video playback error');
      });
    }

    function play(rawUrl) {
      var src = '/api/playlist.m3u8?url=' + encodeURIComponent(rawUrl);
      attachHlsSource(src);
    }
  </script>
</body>

</html>
