<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stream</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.8.3/plyr.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
    <script src="https://cdn.plyr.io/3.8.3/plyr.polyfilled.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        font-family: system-ui, sans-serif;
        color: #fff;
        overflow: hidden;
      }

      html[data-player-rendering],
      html[data-player-rendering] body {
        width: 100% !important;
        min-width: 0 !important;
        height: 100% !important;
        min-height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        overscroll-behavior: none !important;
        background: #000 !important;
      }

      html[data-player-rendering] body {
        font-family: system-ui, sans-serif !important;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #000;
      }

      #loader-bg {
        position: absolute;
        inset: 0;
        background-position: center;
        background-size: cover;
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      .spinner {
        position: relative;
        z-index: 1;
        width: 72px;
        height: 72px;
        border: 5px solid rgba(255, 255, 255, 0.15);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #loader-text {
        position: relative;
        z-index: 1;
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 0.04em;
        text-shadow: 0 1px 4px #000;
      }

      #player {
        position: fixed;
        inset: 0;
        display: none;
        background: #000;
      }

      html[data-player-rendering] #player,
      html[data-player-rendering] #player * {
        letter-spacing: 0 !important;
        text-shadow: none !important;
        text-transform: none !important;
      }

      #player .plyr {
        width: 100%;
        height: 100%;
        color: #fff;
        touch-action: manipulation;
        overflow: visible;
        --plyr-color-main: #00b3ff;
        --plyr-video-background: #000;
        --plyr-video-control-color: #fff;
        --plyr-video-control-color-hover: #fff;
        --plyr-video-control-background-hover: rgba(0, 179, 255, 0.9);
        --plyr-menu-background: rgba(17, 24, 39, 0.98);
        --plyr-menu-color: #f8fafc;
        --plyr-menu-border-color: rgba(255, 255, 255, 0.12);
        --plyr-menu-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        --plyr-tooltip-background: rgba(17, 24, 39, 0.96);
        --plyr-tooltip-color: #fff;
        --plyr-control-radius: 6px;
      }

      #player .plyr__captions .plyr__caption {
        line-height: 0 !important;
      }

      #player .plyr button,
      #player .plyr [role="button"] {
        border: 0 !important;
        box-shadow: none;
        color: inherit !important;
        font: inherit !important;
      }

      #player .plyr__control {
        background-color: transparent !important;
        line-height: 1;
        vertical-align: middle;
      }

      #player .plyr__controls .plyr__control,
      #player .plyr__control--overlaid {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
      }

      #player .plyr__controls .plyr__control svg,
      #player .plyr__control--overlaid svg {
        margin: auto;
      }

      #player .plyr__control--overlaid {
        color: #fff !important;
        background: rgba(0, 179, 255, 0.95) !important;
      }

      #player .plyr__control--overlaid:hover,
      #player .plyr__control--overlaid:focus-visible {
        color: #fff !important;
        background: #38bdf8 !important;
      }

      #player .plyr__controls {
        z-index: 7;
        overflow: visible;
      }

      #player .plyr__controls .plyr__control {
        color: #fff;
      }

      #player .plyr__controls .plyr__control:hover,
      #player .plyr__controls .plyr__control:focus-visible,
      #player .plyr__controls .plyr__control[aria-expanded="true"] {
        color: #fff !important;
        background: rgba(0, 179, 255, 0.9) !important;
      }

      /* Plyr settings / captions menus */
      #player .plyr__menu__container {
        --plyr-menu-width: 300px;
        --plyr-menu-max-height: min(75dvh, calc(100dvh - 96px));
        z-index: 30;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: var(--plyr-menu-width) !important;
        min-width: min(var(--plyr-menu-width), calc(100vw - 24px)) !important;
        max-width: calc(100vw - 24px) !important;
        max-height: var(--plyr-menu-max-height) !important;
        padding: 6px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        color: #f8fafc !important;
        background: rgba(17, 24, 39, 0.98) !important;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }

      #player .plyr__menu__container::after {
        border-top-color: rgba(17, 24, 39, 0.98) !important;
      }

      #player .plyr__menu__container > div {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
        width: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        background: transparent !important;
        overflow: hidden !important;
      }

      #player .plyr__menu__container [role="menu"] {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        max-height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.28) transparent;
      }

      #player .plyr__menu__container [role="menu"]::-webkit-scrollbar {
        width: 6px;
      }

      #player .plyr__menu__container [role="menu"]::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.28);
      }

      #player .plyr__menu__container [role="menu"]::-webkit-scrollbar-track {
        background: transparent;
      }

      #player .plyr__menu__container .plyr__control {
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100% !important;
        min-width: 0;
        min-height: 42px;
        padding: 10px 12px !important;
        border-radius: 8px;
        color: #f8fafc !important;
        white-space: normal;
        overflow: visible;
        text-overflow: unset;
      }

      #player .plyr__menu__container .plyr__control > span {
        min-width: 0;
        overflow: visible;
        text-overflow: unset;
        white-space: nowrap;
      }

      #player .plyr__menu__container .plyr__menu__value,
      #player .plyr__menu__container .plyr__control > span + span {
        flex: 1 1 auto;
        margin-left: auto;
        padding-left: 12px;
        text-align: right;
        color: rgba(248, 250, 252, 0.72);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #player .plyr__menu__container .plyr__control:hover,
      #player .plyr__menu__container .plyr__control:focus-visible,
      #player
        .plyr__menu__container
        .plyr__control[role="menuitemradio"][aria-checked="true"] {
        color: #fff !important;
        background: rgba(0, 179, 255, 0.9) !important;
      }

      #player .plyr__menu__container .plyr__control:hover .plyr__menu__value,
      #player
        .plyr__menu__container
        .plyr__control[aria-checked="true"]
        .plyr__menu__value,
      #player
        .plyr__menu__container
        .plyr__control:hover
        > span
        + span {
        color: #fff !important;
      }

      #player .plyr__menu__container .plyr__control--back {
        margin-bottom: 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      #player .plyr__video-wrapper {
        width: 100%;
        height: 100%;
        background: #000;
      }

      video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      #mobile-seek-feedback {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 30;
        width: 74px;
        height: 74px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 800;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.88);
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
        backdrop-filter: blur(12px);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
      }

      #mobile-seek-feedback.visible {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      #buffering-indicator {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 29;
        width: 58px;
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.58);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.94);
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
        backdrop-filter: blur(10px);
      }

      #buffering-indicator.visible {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      #buffering-indicator::before {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.28);
        border-top-color: #fff;
        border-radius: 50%;
        content: "";
        animation: spin 0.8s linear infinite;
      }

      #recovery-overlay {
        position: absolute;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 28px 24px;
        text-align: center;
        background: rgba(5, 7, 10, 0.88);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        backdrop-filter: blur(8px);
      }

      #recovery-overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }

      #recovery-overlay .recovery-spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(255, 255, 255, 0.22);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      #recovery-overlay-title {
        margin: 0;
        color: #f8fafc;
        font-size: 1.05rem;
        font-weight: 700;
      }

      #recovery-overlay-message {
        margin: 0;
        max-width: 28rem;
        color: rgba(248, 250, 252, 0.82);
        font-size: 0.92rem;
        line-height: 1.45;
      }

      #recovery-overlay-attempt {
        margin: 0;
        color: rgba(148, 163, 184, 0.95);
        font-size: 0.8rem;
      }

      html[data-stream-recovering] #player .plyr__control--overlaid,
      html[data-stream-recovering] #player .plyr__controls,
      html[data-stream-recovering] #player .plyr__progress {
        pointer-events: none !important;
      }

      html[data-stream-recovering] #player .plyr__control--overlaid {
        opacity: 0 !important;
        visibility: hidden !important;
      }

      #credits-actions {
        position: absolute;
        right: 16px;
        bottom: calc(76px + env(safe-area-inset-bottom));
        z-index: 35;
        display: none;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        max-width: min(360px, calc(100vw - 32px));
        pointer-events: none;
      }

      #credits-actions.visible {
        display: flex;
        pointer-events: auto;
      }

      html[data-stream-recovering] #credits-actions {
        display: none !important;
        pointer-events: none !important;
      }

      .credits-action {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        min-width: 180px;
        max-width: 100%;
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        font: inherit;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(12px);
        transition:
          transform 0.16s ease,
          opacity 0.16s ease;
      }

      .credits-action:hover,
      .credits-action:focus-visible {
        transform: translateY(-1px);
        outline: none;
      }

      .credits-action-primary {
        background: rgba(248, 250, 252, 0.96);
        color: #020617;
      }

      .credits-action-secondary {
        background: rgba(15, 23, 42, 0.84);
        color: #f8fafc;
      }

      .credits-action-title {
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.2;
      }

      .credits-action-sub {
        font-size: 0.8rem;
        font-weight: 500;
        line-height: 1.35;
        opacity: 0.82;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }

      .credits-action.hidden {
        display: none;
      }

      #player .plyr--hide-controls ~ #credits-actions {
        bottom: calc(24px + env(safe-area-inset-bottom));
      }

      #stream-actions {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 5;
        display: none;
        gap: 8px;
      }

      .stream-btn {
        min-width: 88px;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.68);
        color: #fff;
        font: inherit;
        font-size: 0.82rem;
        cursor: pointer;
        backdrop-filter: blur(10px);
      }

      .stream-btn:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      .stream-btn:focus-visible {
        outline: 2px solid #60a5fa;
        outline-offset: 2px;
      }

      #copy-status {
        position: fixed;
        top: 56px;
        right: 12px;
        z-index: 6;
        max-width: min(360px, calc(100vw - 24px));
        padding: 9px 11px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.78);
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.8rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #copy-status.visible {
        opacity: 1;
      }

      @media (max-width: 600px) {
        #stream-actions {
          left: 12px;
          right: 12px;
        }

        .stream-btn {
          flex: 1;
        }

        #copy-status {
          left: 12px;
          right: 12px;
        }
      }

      @media (max-width: 760px), (pointer: coarse) {
        #player .plyr__menu__container {
          --plyr-menu-width: min(320px, calc(100vw - 24px));
          --plyr-menu-max-height: min(
            70dvh,
            calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 88px)
          );
        }

        #player .plyr__menu__container .plyr__control {
          min-height: 46px;
          padding: 12px 14px !important;
        }

        #player .plyr__menu__container .plyr__control:hover,
        #player .plyr__menu__container .plyr__control:focus-visible,
        #player
          .plyr__menu__container
          .plyr__control[role="menuitemradio"][aria-checked="true"] {
          background: rgba(0, 179, 255, 0.22) !important;
        }

        #player .plyr__control--overlaid {
          width: 64px !important;
          height: 64px !important;
          padding: 18px !important;
        }

        #player .plyr__controls {
          display: flex;
          flex-wrap: nowrap;
          align-items: center;
          gap: 8px;
          padding: 8px max(10px, env(safe-area-inset-right))
            calc(10px + env(safe-area-inset-bottom))
            max(10px, env(safe-area-inset-left));
        }

        #player .plyr__controls .plyr__control {
          width: 40px;
          min-width: 40px;
          height: 40px;
          min-height: 40px;
          padding: 9px !important;
          background: transparent !important;
          flex: 0 0 40px;
        }

        #player .plyr__controls .plyr__control:hover,
        #player .plyr__controls .plyr__control:focus,
        #player .plyr__controls .plyr__control:focus-visible,
        #player .plyr__controls .plyr__control[aria-expanded="true"] {
          background: transparent !important;
        }

        #player .plyr__controls .plyr__control svg {
          width: 20px;
          height: 20px;
        }

        #player .plyr__controls [data-plyr="rewind"],
        #player .plyr__controls [data-plyr="fast-forward"] {
          display: none !important;
        }

        #player .plyr__progress__container {
          flex: 1 1 auto;
          min-width: 92px;
          padding: 0 2px;
        }

        #player .plyr__progress input[type="range"] {
          min-height: 24px;
        }

        #player .plyr__time {
          font-size: 0.76rem;
          white-space: nowrap;
          flex: 0 0 auto;
        }

        #player .plyr__time--duration,
        #player .plyr__time--duration::before {
          display: none !important;
        }

        #player .plyr__captions {
          bottom: calc(64px + env(safe-area-inset-bottom));
          padding-inline: 16px;
        }

        #player .plyr--hide-controls .plyr__captions {
          bottom: calc(18px + env(safe-area-inset-bottom));
        }

        #player .plyr__volume,
        #player .plyr__controls [data-plyr="pip"],
        #player .plyr__controls [data-plyr="airplay"] {
          display: none;
        }

        #mobile-seek-feedback {
          width: 68px;
          height: 68px;
          font-size: 0.9rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #mobile-seek-feedback,
        #buffering-indicator {
          transition: none;
        }

        #buffering-indicator::before {
          animation: none;
        }
      }

      #usage {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #000;
        gap: 10px;
      }

      #usage p {
        font-size: 1.05rem;
        color: rgba(255, 255, 255, 0.65);
        line-height: 2;
      }

      #err {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #000;
        padding: 24px;
      }

      #err-title {
        font-size: 2.4rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 18px;
      }

      #err-message {
        max-width: 520px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 1.08rem;
        line-height: 1.55;
        margin-bottom: 20px;
      }

      #err-retry {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 18px;
        padding: 10px 18px;
      }

      #err-retry:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      #err-detail {
        width: min(620px, 90vw);
        font-size: 0.82rem;
        color: rgba(255, 255, 255, 0.58);
        text-align: left;
      }

      #err-detail summary {
        cursor: pointer;
        color: rgba(255, 255, 255, 0.76);
        text-align: center;
      }

      #err-debug {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        white-space: pre-wrap;
        word-break: break-word;
        max-width: 90vw;
      }
      video::cue {
        background: rgba(0, 0, 0, 0.68);
        color: #fff;
        font-size: 1.08rem;
        text-shadow: none;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>

  <body>
    <div id="loader">
      <div id="loader-bg"></div>
      <div class="spinner"></div>
      <div id="loader-text">Loading stream...</div>
    </div>

    <div id="usage">
      <p>
        <span style="color: #fff; font-size: 1.2rem">Stream</span><br /><br />
        <code style="color: rgba(255, 255, 255, 0.8)">?id=550</code> &nbsp;—
        movie<br />
        <code style="color: rgba(255, 255, 255, 0.8)"
          >?id=456&amp;s=1&amp;e=1</code
        >
        &nbsp;— TV episode
      </p>
    </div>

    <div id="err">
      <div id="err-title">Error Occurred</div>
      <div id="err-message"></div>
      <button id="err-retry" type="button">Try again</button>
      <details id="err-detail">
        <summary>Details</summary>
        <pre id="err-debug"></pre>
      </details>
    </div>

    <div id="player">
      <video id="v" controls playsinline preload="auto"></video>
      <div
        id="mobile-seek-feedback"
        aria-live="polite"
        aria-atomic="true"
      ></div>
      <div
        id="buffering-indicator"
        aria-label="Buffering"
        aria-live="polite"
      ></div>
      <div
        id="recovery-overlay"
        aria-hidden="true"
        aria-live="assertive"
        role="alertdialog"
        aria-labelledby="recovery-overlay-title"
        aria-describedby="recovery-overlay-message"
      >
        <div class="recovery-spinner" aria-hidden="true"></div>
        <p id="recovery-overlay-title">Reconnecting stream</p>
        <p id="recovery-overlay-message">

      function savedQualityHeight(qualityOptions, includeAuto) {

      function safeRead(key) {
        try {
          return JSON.parse(localStorage.getItem(key) || "null");
        } catch (err) {
          return null;
        }
      }

      function safeWrite(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (err) {}
      }

      function safeRemove(key) {
        try {
          localStorage.removeItem(key);
        } catch (err) {}
      }

      function migrateSubtitlePrefs() {
        if (!id) return;
        var legacyGlobal = safeRead("preference:subtitle");
        if (legacyGlobal && !safeRead(subtitleKey())) {
          safeWrite(subtitleKey(), legacyGlobal);
        }
      }

      function migratePlyrStoragePrefs() {
        var plyrSaved = safeRead("plyr");
        if (!plyrSaved) return;
        if (!safeRead(subtitleKey()) && plyrSaved.captions && plyrSaved.language) {
          safeWrite(subtitleKey(), {
            off: false,
            language: plyrSaved.language,
            label: "",
            updatedAt: Date.now(),
          });
        }
        if (
          !safeRead(qualityKey()) &&
          Number.isFinite(Number(plyrSaved.quality))
        ) {
          safeWrite(qualityKey(), {
            height: Number(plyrSaved.quality),

      function basePayload() {
        return {
          id: id || "",
          mediaType: mediaType,
          season: mediaType === "tv" ? numericParam(s || "1") : null,
          episode: mediaType === "tv" ? numericParam(e || "1") : null,
        };
      }

      function postPlayerEvent(type, payload) {
        var event = {
          type: "movie-scraper:" + type,
          payload: Object.assign(basePayload(), payload || {}),
        };
        try {
          window.parent && window.parent.postMessage(event, "*");
        } catch (err) {}
      }

      function postPlayerPreference(kind, value) {
        postPlayerEvent("preference", { kind: kind, value: value });
      }

      function mergeExternalPreferences(prefs) {
        if (!prefs || typeof prefs !== "object") return;
        ["quality", "speed", "caption-font-size"].forEach(function (kind) {
          if (!prefs[kind]) return;
          safeWrite("preference:" + kind, prefs[kind]);
        });
        if (prefs.speed && plyr && Number.isFinite(Number(prefs.speed.rate))) {
          plyr.speed = Number(prefs.speed.rate);
        }
        if (prefs["caption-font-size"]) applyCaptionFontSize();
        if (
          prefs.quality &&
          Number.isFinite(Number(prefs.quality.height)) &&
          (currentStreamType === "hls" || currentStreamType === "file")
        ) {
          setQuality(Number(prefs.quality.height));
        }
      }

      window.addEventListener("message", function (event) {
        var message = event.data;
        if (!message || typeof message.type !== "string") {
          return;
        }
        if (message.type === "movie-scraper:apply-preferences") {
          mergeExternalPreferences(message.payload);
          return;
        }
        if (message.type === "movie-scraper:watch-actions") {

      function applyWatchActions(payload) {

      function shouldShowCreditsActions() {
        if (!isEmbed || !watchActions || !videoEl || isStreamRecovering()) {

        var currentTime = videoEl.currentTime || 0;
        var rules = watchActions.showRules || {};
        var percent = (currentTime / duration) * 100;
        var remaining = duration - currentTime;
        var pctRule = Number(rules.percent) || 92;
        var maxRem = Number(rules.maxRemainingSeconds) || 90;
        var lead = Number(rules.creditsLeadSeconds);
        if (Number.isFinite(lead) && lead > 0 && remaining <= lead) {
          return true;
        }
        if (remaining <= maxRem) return true;
        if (percent >= pctRule) return true;
        return false;
      }

      function wireCreditsActions() {

      function formatRecoveryTime(seconds) {
        var total = Math.max(0, Math.floor(Number(seconds) || 0));
        var hours = Math.floor(total / 3600);
        var minutes = Math.floor((total % 3600) / 60);
        var secs = total % 60;
        if (hours > 0) {
          return (
            hours +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
          );
        }
        return minutes + ":" + String(secs).padStart(2, "0");
      }

      function bufferAheadSeconds(video) {
        if (!video || !video.buffered || !video.buffered.length) return 0;
        var current = video.currentTime || 0;
        for (var i = 0; i < video.buffered.length; i++) {
          if (
            video.buffered.start(i) <= current &&
            current <= video.buffered.end(i)
          ) {
            return Math.max(0, video.buffered.end(i) - current);
          }
        }
        return 0;
      }

      function createPlaybackRecoveryMachine(api) {
        var STATE = {
          idle: "idle",
          deferred: "deferred",
          scheduled: "scheduled",
          restoring: "restoring",
          stabilizing: "stabilizing",
          failed: "failed",
        };

        var ctx = {
          state: STATE.idle,
          attempt: 0,
          startedAt: 0,
          wasPlaying: false,
          lastError: null,
          lastErrorAt: 0,
          nonFatalCount: 0,
          fragSinceRestore: false,
          healthySince: 0,
          deferredHealthySince: 0,
          scheduleTimer: null,
          stabilizeTimer: null,
          healthyTimer: null,
        };

        function clearScheduleTimer() {
          if (ctx.scheduleTimer) {
            clearTimeout(ctx.scheduleTimer);
            ctx.scheduleTimer = null;
          }
        }

        function clearStabilizeTimer() {
          if (ctx.stabilizeTimer) {
            clearTimeout(ctx.stabilizeTimer);
            ctx.stabilizeTimer = null;
          }
        }

        function clearHealthyTimer() {
          if (ctx.healthyTimer) {
            clearTimeout(ctx.healthyTimer);
            ctx.healthyTimer = null;
          }
        }

        function clearAllTimers() {
          clearScheduleTimer();
          clearStabilizeTimer();
          clearHealthyTimer();
        }

        function setState(next) {
          ctx.state = next;
          document.documentElement.setAttribute("data-recovery-state", next);
        }

        function isBlocking() {
          return (
            ctx.state === STATE.scheduled ||
            ctx.state === STATE.restoring ||
            ctx.state === STATE.stabilizing
          );
        }

        function isActive() {
          return ctx.state !== STATE.idle && ctx.state !== STATE.failed;
        }

        function overlayDetails() {
          var position = api.formatRecoveryTime(api.recoveryStartPosition());
          var checkpoint = api.formatRecoveryTime(api.playbackCheckpoint());
          switch (ctx.state) {
            case STATE.scheduled:
              return {
                title: "Stream interrupted",
                message:
                  "Connection to the stream was lost. Reconnecting and restoring your position. Controls are disabled until recovery completes.",
                attempt: ctx.attempt,
              };
            case STATE.restoring:
              return {
                title: "Reconnecting stream",
                message:
                  "Playback is paused while we restore your position at " +
                  checkpoint +
                  ". Do not press play — recovery will resume automatically.",
                attempt: ctx.attempt,
              };
            case STATE.stabilizing:
              return {
                title: "Restoring playback",
                message:
                  "Reloading stream data and returning to " +
                  position +
                  ". Please wait — controls stay disabled until recovery finishes.",
                attempt: ctx.attempt,
              };
            default:
              return null;
          }
        }

        function syncOverlay() {
          if (isBlocking()) {
            api.setRecoveryOverlay(true, overlayDetails());
          } else {
            api.setRecoveryOverlay(false);
          }
        }

        function finishDeferredSuccess() {
          ctx.attempt = 0;
          ctx.startedAt = 0;
          ctx.nonFatalCount = 0;
          ctx.lastError = null;
          ctx.deferredHealthySince = 0;
          setState(STATE.idle);
          syncOverlay();
        }

        function enterDeferred(data) {
          var now = Date.now();
          if (!ctx.startedAt) ctx.startedAt = now;
          ctx.lastError = data || ctx.lastError;
          ctx.lastErrorAt = now;
          ctx.deferredHealthySince = 0;
          var video = api.videoEl();
          if (video) {
            ctx.wasPlaying =
              !api.userPlaybackPaused() && !video.paused && !video.ended;
          }
          setState(STATE.deferred);
          syncOverlay();
          console.warn("[movie-scraper:hls-recovery]", {
            mode: "deferred",
            bufferAhead: api.bufferAheadSeconds(),
            threshold: api.bufferBlockThreshold,
            type: (data && data.type) || "",
            details: (data && data.details) || "",
          });
        }

        function shouldDeferRecovery(data) {
          if (!data || data.fatal) return false;
          if (ctx.state !== STATE.idle) return false;
          return api.bufferAheadSeconds() >= api.bufferBlockThreshold;
        }

        function recoveryDelay(attempt) {
          var delay =
            api.baseDelay * Math.pow(2, Math.max(0, attempt - 1));
          return Math.min(api.maxDelay, delay);
        }

        function pauseIfNeeded() {
          var video = api.videoEl();
          if (!ctx.wasPlaying && video) {
            ctx.wasPlaying =
              !api.userPlaybackPaused() && !video.paused && !video.ended;
          }
          if (ctx.wasPlaying) api.pauseVideo();
        }

        function playbackHealthy() {
          var video = api.videoEl();
          if (!video || video.seeking) return false;
          if (video.readyState < 3) return false;
          var checkpoint = api.playbackCheckpoint();
          var current = api.currentPlaybackSeconds();
          if (checkpoint > 5 && current + 15 < checkpoint) return false;
          if (Date.now() - ctx.lastErrorAt < api.healthyDebounceMs) return false;
          if (
            (ctx.state === STATE.restoring ||
              ctx.state === STATE.stabilizing) &&
            !ctx.fragSinceRestore
          ) {
            return false;
          }
          return true;
        }

        function scheduleHealthyCheck() {
          if (ctx.healthyTimer || ctx.state !== STATE.stabilizing) return;
          ctx.healthyTimer = setTimeout(function () {
            ctx.healthyTimer = null;
            if (ctx.state !== STATE.stabilizing) return;
            if (playbackHealthy()) {
              if (!ctx.healthySince) ctx.healthySince = Date.now();
              if (
                Date.now() - ctx.healthySince >=
                api.healthyDebounceMs
              ) {
                finishSuccess();
                return;
              }
            } else {
              ctx.healthySince = 0;
            }
            scheduleHealthyCheck();
          }, 120);
        }

        function finishSuccess() {
          var shouldResume = ctx.wasPlaying && !api.userPlaybackPaused();
          ctx.wasPlaying = false;
          ctx.attempt = 0;
          ctx.startedAt = 0;
          ctx.nonFatalCount = 0;
          ctx.fragSinceRestore = false;
          clearAllTimers();
          setState(STATE.idle);
          syncOverlay();
          api.suppressProgress(1500);
          api.scheduleSubtitleRestoreRetries();
          if (shouldResume) api.playVideo();
        }

        function abort() {
          ctx.wasPlaying = false;
          ctx.attempt = 0;
          ctx.startedAt = 0;
          ctx.nonFatalCount = 0;
          ctx.fragSinceRestore = false;
          clearAllTimers();
          setState(STATE.idle);
          syncOverlay();
        }

        function giveUp(data) {
          ctx.wasPlaying = false;
          clearAllTimers();
          setState(STATE.failed);
          syncOverlay();
          api.onGiveUp(data || ctx.lastError);
        }

        function enterStabilizing() {
          if (ctx.state === STATE.stabilizing) {
            syncOverlay();
            scheduleHealthyCheck();
            return;
          }
          setState(STATE.stabilizing);
          ctx.healthySince = 0;
          syncOverlay();
          api.restorePlaybackPosition();
          api.scheduleSubtitleRestoreRetries();
          api.suppressProgress(2500);
          clearStabilizeTimer();
          ctx.stabilizeTimer = setTimeout(function () {
            ctx.stabilizeTimer = null;
            if (ctx.state !== STATE.stabilizing) return;
            var video = api.videoEl();
            if (video && video.readyState >= 2 && ctx.fragSinceRestore) {
              finishSuccess();
              return;
            }
            dispatch("HLS_ERROR", ctx.lastError || { fatal: true });
          }, api.stabilizingMaxMs);
          scheduleHealthyCheck();
        }

        function performRestore() {
          setState(STATE.restoring);
          ctx.fragSinceRestore = false;
          ctx.healthySince = 0;
          syncOverlay();
          api.updatePlaybackCheckpoint(api.currentPlaybackSeconds());
          api.suppressProgress(5000);
          api.scheduleSubtitleRestoreRetries();
          var data = ctx.lastError || {};
          var position = api.recoveryStartPosition();
          try {
            var hlsInstance = api.hls();
            if (
              hlsInstance &&
              window.Hls &&
              data.type === Hls.ErrorTypes.MEDIA_ERROR &&
              hlsInstance.recoverMediaError
            ) {
              hlsInstance.recoverMediaError();
            } else if (hlsInstance && hlsInstance.startLoad) {
              hlsInstance.startLoad(position > 0 ? position : -1);
            }
            enterStabilizing();
          } catch (err) {
            giveUp(data);
          }
        }

        function scheduleRecovery(data) {
          var now = Date.now();
          if (!ctx.startedAt) ctx.startedAt = now;
          ctx.attempt += 1;
          ctx.lastError = data || ctx.lastError;
          ctx.lastErrorAt = now;

          var elapsed = now - ctx.startedAt;
          if (ctx.attempt > api.maxAttempts || elapsed > api.maxElapsed) {
            giveUp(data);
            return;
          }

          if (ctx.state === STATE.idle || ctx.state === STATE.failed) {
            api.updatePlaybackCheckpoint(api.currentPlaybackSeconds());
            pauseIfNeeded();
          } else if (ctx.state === STATE.deferred) {
            api.updatePlaybackCheckpoint(api.currentPlaybackSeconds());
            pauseIfNeeded();
          }

          clearAllTimers();
          setState(STATE.scheduled);
          syncOverlay();
          var delay = recoveryDelay(ctx.attempt);
          console.warn("[movie-scraper:hls-recovery]", {
            attempt: ctx.attempt,
            delay: delay,
            state: ctx.state,
            type: (data && data.type) || "",
            details: (data && data.details) || "",
          });
          ctx.scheduleTimer = setTimeout(function () {
            ctx.scheduleTimer = null;
            if (ctx.state === STATE.scheduled) performRestore();
          }, delay);
        }

        function dispatch(event, payload) {
          switch (event) {
            case "HLS_ERROR": {
              var data = payload || {};
              ctx.lastErrorAt = Date.now();
              if (
                !data.fatal &&
                ctx.state === STATE.idle &&
                ctx.nonFatalCount + 1 < api.nonFatalThreshold
              ) {
                ctx.nonFatalCount += 1;
                ctx.lastError = data;
                return;
              }
              if (ctx.state === STATE.scheduled) {
                ctx.lastError = data;
                return;
              }
              if (ctx.state === STATE.deferred) {
                ctx.lastError = data;
                ctx.lastErrorAt = Date.now();
                return;
              }
              if (shouldDeferRecovery(data)) {
                enterDeferred(data);
                return;
              }
              scheduleRecovery(data);
              break;
            }
            case "MANIFEST_PARSED":
              if (isBlocking() || ctx.state === STATE.restoring) {
                enterStabilizing();
              }
              break;
            case "FRAG_LOADED":
            case "LEVEL_LOADED":
              if (ctx.state === STATE.deferred) {
                if (!ctx.deferredHealthySince) {
                  ctx.deferredHealthySince = Date.now();
                } else if (
                  Date.now() - ctx.deferredHealthySince >=
                  api.deferredHealthyMs
                ) {
                  finishDeferredSuccess();
                }
                break;
              }
              if (
                ctx.state === STATE.restoring ||
                ctx.state === STATE.stabilizing
              ) {
                ctx.fragSinceRestore = true;
                scheduleHealthyCheck();
              }
              break;
            case "WAITING":

          : { top: window.innerHeight * 0.82, bottom: window.innerHeight };

          140,
          Math.min(availableAbove, window.innerHeight - viewportPad * 2),
        );

          window.matchMedia &&
          window.matchMedia("(max-width: 760px), (pointer: coarse)").matches;
        var width = Math.min(
          isCoarse ? 320 : 300,
          window.innerWidth - viewportPad * 2,

          .querySelectorAll("#player .plyr__menu__container")
          .forEach(function (menu) {
            menu.style.setProperty("--plyr-menu-width", width + "px");
            menu.style.setProperty("--plyr-menu-max-height", maxHeight + "px");
            menu.style.width = width + "px";
            menu.style.minWidth =
              Math.min(width, window.innerWidth - viewportPad * 2) + "px";

              menu.style.left = viewportPad + "px";
              menu.style.right = "auto";

              menu.style.setProperty("--plyr-menu-max-height", reduced + "px");

                120,

          event.clientX - mobileGestureTap.x,
          event.clientY - mobileGestureTap.y,

          zone: zone,

      function progressPayload(endedOverride) {
